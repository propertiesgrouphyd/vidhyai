<body>

  <div class="app-shell">

    <header class="topbar">

      <div class="topbar-inner">

        <button
          class="brand"
          id="brandButton"
          type="button"
          aria-label="VIDHWAAN Vidhyai home"
        >

          <img
            class="brand-logo"
            src="./icons/logo.png"
            alt="VIDHWAAN Vidhyai"
            width="44"
            height="44"
          >

          <span class="brand-copy">

            <span class="brand-name">
              VIDHWAAN
            </span>

            <span class="brand-product">
              Vidhyai
            </span>

          </span>

        </button>

        <div class="topbar-actions">

          <span class="topbar-pill">
            365 DAYS
          </span>

          <span class="topbar-pill topbar-pill-gold">
            AI LEARNING
          </span>

        </div>

      </div>

    </header>

    <main id="mainContent">

      <section
        id="dayNavigator"
        class="day-navigator"
        aria-labelledby="courseTitle"
      >

        <div class="course-hero">

          <div class="course-hero-copy">

            <h1 id="courseTitle">
              AI Learning Journey
            </h1>

            <p class="course-description">
              One lesson every day · A new lesson every day at 6:00 AM
            </p>

          </div>

          <div class="today-panel">

            <span class="today-panel-label">
              TODAY
            </span>

            <strong
              id="todayLabel"
              class="today-panel-date"
            >
              Loading...
            </strong>

          </div>

        </div>

        <div class="days-heading">

          <div>

            <h2>
              Learning Days
            </h2>

          </div>

          <span class="days-count">
            1 — 365
          </span>

        </div>

        <div
          id="dayGrid"
          class="day-grid"
          aria-label="365 AI learning course days"
        ></div>

        <div class="navigator-note">

          <span
            class="navigator-note-dot"
            aria-hidden="true"
          ></span>

          <span>
            Lessons are released sequentially every day at 6:00 AM
          </span>

        </div>

      </section>

      <section
        id="lessonView"
        class="lesson-view"
        hidden
        aria-live="polite"
      >

        <div class="lesson-topbar">

          <button
            id="backButton"
            class="back-button"
            type="button"
          >

            <span aria-hidden="true">
              ←
            </span>

            <span>
              All Days
            </span>

          </button>

          <span
            id="lessonDayBadge"
            class="lesson-day-badge"
          >
            DAY
          </span>

        </div>

        <div
          id="lessonContainer"
          class="lesson-container"
        ></div>

      </section>

      <section
        id="statusView"
        class="status-view"
        hidden
        aria-live="polite"
      >

        <div class="status-card">

          <div
            class="status-icon"
            aria-hidden="true"
          >
            !
          </div>

          <h2 id="statusTitle">
            Lesson Not Available
          </h2>

          <p id="statusMessage"></p>

          <button
            id="statusBackButton"
            class="back-button"
            type="button"
          >

            <span aria-hidden="true">
              ←
            </span>

            <span>
              All Days
            </span>

          </button>

        </div>

      </section>

    </main>

    <footer class="site-footer">

      <div class="footer-inner">

        <div class="footer-brand">

          <img
            class="footer-logo"
            src="./icons/logo.png"
            alt="VIDHWAAN"
            width="40"
            height="40"
          >

          <div class="footer-brand-copy">

            <strong>
              VIDHWAAN
            </strong>

            <span>
              Vidhyai
            </span>

          </div>

        </div>

        <div class="footer-copyright">
          © VIDHWAAN
        </div>

      </div>

    </footer>

  </div>

  <button
    id="pwaInstallButton"
    class="pwa-install-button"
    type="button"
    aria-label="Install VIDHWAAN Vidhyai"
    hidden
  >

    <span
      class="pwa-install-icon"
      aria-hidden="true"
    >
      ↓
    </span>

    <span class="pwa-install-text">

      <strong>
        Install Vidhyai
      </strong>

      <small>
        Use like an app
      </small>

    </span>

  </button>

  <script
    src="app.js"
    defer
  ></script>

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js", {
            scope: "./"
          })
          .then(registration => {

            console.log(
              "VIDHWAAN Vidhyai service worker registered:",
              registration.scope
            );

          })
          .catch(error => {

            console.error(
              "Service worker registration failed:",
              error
            );

          });

      });

    }

  </script>
